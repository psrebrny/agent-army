<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MealPrep — Sign up</title></head>
<body>
  <h1>Welcome to MealPrep</h1>
  <form action="/signup" method="post">
    <input name="email" placeholder="Email">
    <input name="password" type="password" placeholder="Password">
    <input name="password2" type="password" placeholder="Password">
    <input name="phone" placeholder="Phone">
    <input name="birthday" placeholder="dd/mm/yyyy">
    <select name="diet"><option>Choose</option><option>Vegan</option><option>Keto</option></select>
    <button>Submit</button>
  </form>
  <p style="color:#bbb;font-size:11px">By clicking Submit you agree to our terms.</p>
</body></html>
