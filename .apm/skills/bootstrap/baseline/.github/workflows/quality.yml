# agent-army-owned
# agent-army-package: 0.3.0
name: agent-army-quality

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bootstrap must replace the discovered commands with commands that also
      # provision their dependencies in CI (for example setup-node/npm ci).
      - name: Verify Agent Army quality profile
        run: python3 .agent-army/runtime.py verify
